name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Headless JVM for KSP
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.jvmargs=-Xmx3072m -Djava.awt.headless=true -Dfile.encoding=UTF-8" >> "$HOME/.gradle/gradle.properties"
          echo "org.gradle.daemon=false" >> "$HOME/.gradle/gradle.properties"

      - name: Remove google-services constraint & Bypass signing check
        run: |
          rm -f app/google-services.json
          find . -name "build.gradle*" -exec sed -i '/signingConfig /d' {} + || true

      - name: Build APK with System Gradle
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: gradle assembleDebug --no-daemon -x lint -Pcom.google.gms.google-services.disabled=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-sir-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            build/outputs/apk/debug/*.apk
