name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Remove google-services constraint & Bypass signing check
      run: |
        rm -f app/google-services.json
        find . -name "build.gradle*" -exec sed -i '/signingConfig /d' {} + || true

    - name: Build APK with System Gradle
      run: gradle assembleDebug -x lint -Pcom.google.gms.google-services.disabled=true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hello-sir-debug
        path: |
          app/build/outputs/apk/debug/*.apk
          build/outputs/apk/debug/*.apk
